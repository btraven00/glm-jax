[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glm-jax"
version = "0.0.1"
description = "Batched, jit-compiled GLM kernel in JAX for omics pipelines (edgeR/DESeq2-style)"
requires-python = ">=3.10"
dependencies = ["jax", "numpy"]

[project.optional-dependencies]
test = ["pytest", "scipy"]

[tool.setuptools]
packages = ["glm_jax"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10"

[tool.pixi.pypi-dependencies]
glm-jax = { path = ".", editable = true }

[tool.pixi.feature.cuda.pypi-dependencies]
jax = { version = "*", extras = ["cuda12"] }

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
gpu = { features = ["test", "cuda"] }
evolve = { features = ["test", "evolve"] }

[tool.pixi.tasks]
test = "pytest -q"
bench = "python examples/benchmark.py"

[tool.pixi.feature.evolve.pypi-dependencies]
anthropic = "*"
